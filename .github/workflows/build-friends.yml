---
name: Build Friends

# Matrix build for the sibling images in friends/. Each bootc variant builds
# through `just build` with its own build/<variant>/ + custom/<variant>/ dirs;
# ai is a plain application container built directly with podman.
#
# Tag convention matches build-image.yml: main publishes :stable-testing,
# stable publishes :stable.

on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  PRODUCTION_BRANCH: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: aira
            image_name: cargoyard-aira
            mode: bootc
            containerfile: friends/aira/Containerfile
          - variant: crmy
            image_name: cargoyard-crmy
            mode: bootc
            containerfile: friends/crmy/Containerfile
          - variant: server
            image_name: cargoyard-server
            mode: bootc
            containerfile: friends/server/Containerfile
          - variant: ai
            image_name: ai
            mode: app
            containerfile: friends/ai/Containerfile

    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      REGISTRY_CACHE_WRITE: "1"

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "default-tag=stable-testing" >> "${GITHUB_OUTPUT}"
            echo "Building testing image: stable-testing"
          else
            echo "default-tag=stable" >> "${GITHUB_OUTPUT}"
            echo "Building production image: stable"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        if: matrix.mode == 'bootc'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- bootc variants (aira, crmy, server) ---

      - name: Setup runner
        if: matrix.mode == 'bootc'
        uses: projectbluefin/actions/bootc-build/setup-runner@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        if: matrix.mode == 'bootc'
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}

      - name: Build bootc image
        if: matrix.mode == 'bootc'
        id: build-bootc
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VENDOR: ${{ github.repository_owner }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" \
              "${{ steps.determine-tag.outputs.default-tag }}" \
              "${{ matrix.containerfile }}"

      - name: Get version label
        if: matrix.mode == 'bootc'
        id: version
        shell: bash
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${{ steps.determine-tag.outputs.default-tag }}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Save DNF cache
        if: always() && !cancelled() && matrix.mode == 'bootc'
        uses: projectbluefin/actions/bootc-build/dnf-cache@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: "true"

      - name: Push bootc image to GHCR
        if: matrix.mode == 'bootc'
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@8906e13e3ac1654504e75ad27440bffb28e52fbc # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.determine-tag.outputs.default-tag }} ${{ steps.version.outputs.version }}
          default-tag: ${{ steps.determine-tag.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- app container (ai) ---

      - name: Build AI container
        if: matrix.mode == 'app'
        id: build-app
        shell: bash
        env:
          DEFAULT_TAG: ${{ steps.determine-tag.outputs.default-tag }}
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "Building ${IMAGE_TAG}..."
          podman build --tag "${IMAGE_TAG}" --file "${{ matrix.containerfile }}" .
          echo "image-tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Push AI container to GHCR
        if: matrix.mode == 'app'
        shell: bash
        env:
          DEFAULT_TAG: ${{ steps.determine-tag.outputs.default-tag }}
          IMAGE_TAG: ${{ steps.build-app.outputs.image-tag }}
        run: |
          VERSION_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:$(date -u +%Y%m%d)"
          podman push "${IMAGE_TAG}"
          podman tag "${IMAGE_TAG}" "${VERSION_TAG}"
          podman push "${VERSION_TAG}"

      - name: Build telemetry summary
        if: matrix.mode == 'bootc'
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${IMAGE_NAME}:${{ steps.determine-tag.outputs.default-tag }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          {
            echo "## Build Telemetry: ${IMAGE_NAME}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
