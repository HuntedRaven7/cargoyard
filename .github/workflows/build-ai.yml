---
name: Build AI Container

on:
  push:
    branches:
      - main
      - stable
    paths:
      - 'Containerfile.ai'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "ai"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push AI container
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AI container
        id: build-image
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "Building ${IMAGE_TAG}..."
          podman build \
            --tag "${IMAGE_TAG}" \
            --file Containerfile.ai \
            .
          echo "image-tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Push to GHCR
        run: |
          podman push "${{ steps.build-image.outputs.image-tag }}"

      - name: Generate version label
        id: version
        run: |
          VERSION_LABEL=$(date -u +%Y%m%d)
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Tag additional versions
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          VERSION_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"

          # Tag with version
          podman tag "${IMAGE_TAG}" "${VERSION_TAG}"
          podman push "${VERSION_TAG}"

          # Tag with latest for testing builds
          if [[ "${DEFAULT_TAG}" == "stable-testing" ]]; then
            LATEST_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
            podman tag "${IMAGE_TAG}" "${LATEST_TAG}"
            podman push "${LATEST_TAG}"
          fi
