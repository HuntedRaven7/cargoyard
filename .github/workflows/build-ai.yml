---
name: Build AI

# ai sandbox container (NVIDIA CUDA base, plain application container —
# not bootc). Lives outside friends/ with its own workflow. Tag convention
# matches build-image.yml: main publishes :stable-testing, stable
# publishes :stable.

on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "ai"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  PRODUCTION_BRANCH: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ai
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "default-tag=stable-testing" >> "${GITHUB_OUTPUT}"
            echo "Building testing image: stable-testing"
          else
            echo "default-tag=stable" >> "${GITHUB_OUTPUT}"
            echo "Building production image: stable"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AI container
        id: build-app
        shell: bash
        env:
          DEFAULT_TAG: ${{ steps.determine-tag.outputs.default-tag }}
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "Building ${IMAGE_TAG}..."
          podman build --tag "${IMAGE_TAG}" --file ai/Containerfile .
          echo "image-tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Push AI container to GHCR
        shell: bash
        env:
          DEFAULT_TAG: ${{ steps.determine-tag.outputs.default-tag }}
          IMAGE_TAG: ${{ steps.build-app.outputs.image-tag }}
        run: |
          VERSION_TAG="${IMAGE_REGISTRY}/${IMAGE_NAME}:$(date -u +%Y%m%d)"
          podman push "${IMAGE_TAG}"
          podman tag "${IMAGE_TAG}" "${VERSION_TAG}"
          podman push "${VERSION_TAG}"
