---
name: Build containerino

# Independent update cadence for the Arch-based desktop image.
# Reuses the shared build core in build-image.yml via workflow_call.

on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  schedule:
    # Weekly cadence: refresh the desktop base image tag every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image_name: containerino
      containerfile: custom/container/Containerfile.containerino
